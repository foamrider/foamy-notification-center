# foamy-kit 0.8.1 98bd9e4430551129a6f4c309ee8ba59b66514db5ca1d4c5b7151ec308f6d632b — do not edit; change foamy-kit and run sync
# Rebuilds this plugin's native helper from source on a GitHub-hosted runner
# and compares it byte for byte with the committed bin/<arch>/<binary>.
#
# Everything the build reads is in this repository at the checked-out
# commit: the crate named in <crate>/native.pin, the shared crate in kit/rust,
# Cargo.toml, Cargo.lock, the toolchain pinned in rust-toolchain.toml and the
# build tool itself (kit/native/). Crates come from crates.io at the versions
# and checksums Cargo.lock records.
#
# On pushes and manual runs a second job attests them. It runs on a fresh
# runner that never builds anything (so no build script or dependency can
# touch what it signs): it downloads the rebuilt files, requires each to be
# byte-identical to the committed git blob and to native.pin, and only then
# creates a GitHub (Sigstore) build provenance attestation for them. The
# committed binaries can therefore be checked against this workflow and commit:
#
#   gh attestation verify bin/x86_64/<binary> --repo <owner>/<repo> \
#     --signer-workflow <owner>/<repo>/.github/workflows/verify-native.yml \
#     --source-digest <commit> --deny-self-hosted-runners
#
# Pull request runs rebuild and compare, without attesting.
name: Verify native helpers

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Rebuild and compare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the commit under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report the source under review
        run: |
          git log -1 --format='%H %s'
          echo "Commit \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install the pinned Rust toolchain
        run: |
          channel=$(python3 -I -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt \
            --target x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          rustup run "$channel" rustc --version
          python3 --version

      - name: Check the kit files and the committed binaries
        run: bash tests/kit-check.sh

      - name: Format, lint and test the helper crates
        run: |
          for pin in */native.pin; do
            bash kit/native/build-native.sh . --test --crate "${pin%/native.pin}"
          done

      - name: Rebuild from source and compare with bin/
        run: |
          for pin in */native.pin; do
            bash kit/native/build-native.sh . --verify --crate "${pin%/native.pin}" --out "$RUNNER_TEMP/rebuilt"
          done

      - name: Report the binaries
        if: always()
        run: |
          {
            echo
            echo "| File | Git blob | SHA-256 (committed) | SHA-256 (rebuilt here) |"
            echo "| --- | --- | --- | --- |"
            for pin in */native.pin; do
              binary=$(awk '$1 == "binary" && NF == 2 { print $2; exit }' "$pin")
              for arch in x86_64 aarch64; do
                rel="bin/$arch/$binary"
                rebuilt="$RUNNER_TEMP/rebuilt/$arch/$binary"
                printf '| `%s` | `%s` | `%s` | `%s` |\n' "$rel" "$(git rev-parse "HEAD:$rel")" \
                  "$(sha256sum < "$rel" | cut -d' ' -f1)" \
                  "$(if [[ -f $rebuilt ]]; then sha256sum < "$rebuilt" | cut -d' ' -f1; else echo 'not built'; fi)"
              done
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the rebuilt binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-helpers
          path: ${{ runner.temp }}/rebuilt
          if-no-files-found: warn
          retention-days: 90

  attest:
    name: Attest the rebuilt binaries
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the commit under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the rebuilt binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-helpers
          path: ${{ runner.temp }}/rebuilt

      - name: Require the rebuilt files to equal the committed blobs and native.pin
        run: |
          count=0
          for pin in */native.pin; do
            binary=$(awk '$1 == "binary" && NF == 2 { print $2; exit }' "$pin")
            for arch in x86_64 aarch64; do
              rel="bin/$arch/$binary"
              rebuilt="$RUNNER_TEMP/rebuilt/$arch/$binary"
              git cat-file blob "HEAD:$rel" > "$RUNNER_TEMP/committed"
              cmp "$RUNNER_TEMP/committed" "$rebuilt"
              expected=$(awk -v rel="$rel" '$2 == rel && length($1) == 64 { print $1; exit }' "$pin")
              actual=$(sha256sum < "$rebuilt" | cut -d' ' -f1)
              [[ -n $expected && $actual == "$expected" ]] || { echo "$rel: $actual is not $expected in $pin" >&2; exit 1; }
              echo "$rel: rebuilt file equals blob $(git rev-parse "HEAD:$rel"), sha256 $actual"
              count=$((count + 1))
            done
          done
          files=$(find "$RUNNER_TEMP/rebuilt" -type f | wc -l)
          (( count > 0 && files == count )) || { echo "expected $count rebuilt files, found $files" >&2; exit 1; }

      - name: Attest the rebuilt binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/rebuilt/*/*
