# foamy-kit 0.5.0 868af8f99d78154f4ab510eaa594ed9833639b763939a7f47fb38a0070ea6f6e — do not edit; change foamy-kit and run sync
# The Rust toolchain every foamy native helper is built with. foamy-kit's
# FoamyNative component copies this file to a plugin's root, so cargo picks
# it up anywhere in the plugin (rustup reads it from the working directory
# upwards). tools/build-native.sh records the channel in native.pin.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
profile = "minimal"
