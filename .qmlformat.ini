# foamy-kit 0.9.0 771e7eeb95d50551c7a7a8038f0d033ad3385a63b90f6d767133f5f15b872d5a — do not edit; change foamy-kit and run sync
; qmlformat settings for foamy-kit and every Foamy plugin (synced; edit them in
; foamy-kit). tests/validate.sh compares each QML file with
; `/usr/lib/qt6/bin/qmlformat -s .qmlformat.ini` (Qt 6.12 when chosen).
; Closest to the existing code: 2-space indent, no reordering, no import
; sorting, semicolons only where needed, no column limit.
[General]
FunctionsSpacing=false
GroupAttributesTogether=false
IndentWidth=2
MaxColumnWidth=-1
NewlineType=unix
NormalizeOrder=false
ObjectsSpacing=false
SemicolonRule=essential
SingleLineEmptyObjects=false
SortImports=false
UseTabs=false
